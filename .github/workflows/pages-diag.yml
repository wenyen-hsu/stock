name: Pages Diag
on: workflow_dispatch
permissions:
  pages: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: GET /pages
        run: |
          curl -s -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
