name: Diag Pages
on: workflow_dispatch
permissions:
  contents: read
  pages: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢查網站實際回應與 Pages 設定
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for url in "https://wenyen-hsu.github.io/stock/" "https://wenyen-hsu.github.io/stock/data/meta.json" "https://wenyen-hsu.github.io/stock/index.html"; do
            echo "=== $url ==="
            code=$(curl -sS -o /tmp/body -w "%{http_code}" "$url" || echo "curl-failed")
            echo "HTTP $code"
            head -c 400 /tmp/body; echo; echo
          done
          echo "=== GET /pages 設定 ==="
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" | python3 -m json.tool
          echo "=== 最新 Pages build ==="
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds/latest" | python3 -m json.tool
