name: Probe Dividend APIs

# 拋棄式：探測 TWSE/TPEx 除權息 openapi 的實際欄位名，取得後即刪除本檔。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TPEx exright endpoints
        run: |
          for url in \
            "https://www.tpex.org.tw/openapi/v1/tpex_exright_daily" \
            "https://www.tpex.org.tw/openapi/v1/tpex_exright_prepost" \
            ; do
            echo "===== $url ====="
            curl -s -m 30 "$url" -H "accept: application/json" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              print('rows:', len(data))
              for row in data[:3]:
                  print(json.dumps(row, ensure_ascii=False)[:700])
          except Exception as exc:
              print('FAIL:', exc)
          " || true
          done
