name: Update Taiwan Stock Data

on:
  workflow_dispatch:
    inputs:
      days:
        description: "更新與掃描的交易日數"
        required: false
        default: "20"
  schedule:
    # GitHub Actions 用 UTC。14:30 UTC = 台北 22:30，
    # 此時當日行情、三大法人與融資融券資料皆已公布。
    - cron: "30 14 * * 1-5"

permissions:
  contents: write
  pages: read
  issues: write

concurrency:
  group: update-taiwan-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 還原 SQLite 快取（增量更新，避免每次全量重抓觸發限速）
        uses: actions/cache@v4
        with:
          path: data/stock_chip.sqlite
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 更新官方行情、三大法人與融資融券
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
        run: python -m stock_chip.official --days "$DAYS"

      - name: 更新公司基本資料與產業分類
        continue-on-error: true
        run: python -m stock_chip.profile

      - name: 初步掃描（產生營收抓取名單）
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
        run: python -m stock_chip.scan --days "$DAYS" --limit 100

      - name: 更新月營收（排行優先補缺漏月份 + 全市場分批補齊）
        continue-on-error: true
        run: |
          python -m stock_chip.revenue --months 24 --from-scan 200 --only-missing-month --sleep 0.4
          python -m stock_chip.revenue --months 24 --fill-market 250 --only-missing-month --sleep 0.5

      # 20 季（5 年）而非 8 季：8 季只有 7 季可用（MOPS 給累計數，單季值靠差分，
      # 窗口最舊那季沒有前一季可減必為 null），連 TTM 成長都算不出來——要比較
      # 近四季 vs 前四季就需要 8 季完整值。5 年才涵蓋得到一個景氣循環，
      # 常態化 EPS 與循環位置判斷才有依據。
      # 成本很低：已入庫季度會被跳過（門檻 ≥300 列），只補新增的 12 季 × 3 市場
      # = 36 次請求，sleep 3 秒約 3-5 分鐘，之後每季增量。
      - name: 更新季度財報三率與 EPS（MOPS，僅缺漏季度，涵蓋 5 年）
        continue-on-error: true
        run: python -m stock_chip.financials --quarters 20 --sleep 3

      - name: 更新大盤指數與期貨多空
        continue-on-error: true
        run: python -m stock_chip.market --days 400

      - name: 抓取 MOPS 重大事件
        continue-on-error: true
        run: python -m stock_chip.mops --days 14

      - name: 抓取除權息事件（TWSE TWT49U + TPEx prepost）
        continue-on-error: true
        run: python -m stock_chip.dividends --backfill-days 120

      - name: 抓取 ETF 基本資料與單位數（資金流）
        continue-on-error: true
        run: python -m stock_chip.etf

      - name: 更新 TDCC 股權分散表（每週資料，已入庫則跳過）
        continue-on-error: true
        run: python -m stock_chip.tdcc

      # 當沖候選池的三組資料，端點與欄位皆經探測 workflow 實測（2026-08）：
      # TWSE TWTB4U（當沖標的成交量值，只有上市有）、TWSE/TPEx 處置股
      # （處置期間人工撮合、當沖做不了，是硬排除條件）、TPEx 漲停排隊量。
      # 一天四個請求，成本可忽略。
      - name: 抓取當沖統計、處置股與漲停排隊量
        continue-on-error: true
        run: python -m stock_chip.daytrade

      # 分點抓取已移到獨立的 fetch-branch.yml：那兩步佔了本管線 50 分鐘中的 42
      # 分鐘，2026-08-06 就是斷在分點，導致當天連已經抓好的行情都沒發布出去。
      # 拆開後行情約 10 分鐘就上線，分點自己跑自己的，壞掉也不會擋住行情。
      # 本管線的掃描讀的是快取裡「上一輪」的分點；分點抓完會回頭觸發本管線
      # 重跑，屆時掃描就會吃到當日分點。
      - name: 掃描 20 日與 5 日排行
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
        run: |
          python -m stock_chip.scan --days "$DAYS" --limit 100
          python -m stock_chip.scan --days 5 --limit 100

      - name: 回測統計與快照備份
        continue-on-error: true
        run: python -m stock_chip.backtest

      # 個股新聞先前只有本機 GUI 按鈕會抓，發布站台無法寫入 → 線上每檔都是「無」。
      # 這裡改由管線預抓：各排行前 50 名的交錯聯集 + 自選股（加入 3 個外資動向
      # 排行後實測 472 檔，故上限設 500 讓名單不會被截斷）。
      # 只取排行聯集、不用 --from-scan：完整明細只匯出排行成員（實測 648 檔），
      # 總分前 150 有 11 檔落在其外，抓了也只會進 SQLite 而不會出現在站上。
      # 此步驟排在最終掃描之後，讀到的是最終排行，沒有分點那種「初步榜位移」問題。
      # 護欄：只抓 RSS 標題（不進文章頁，省 3 倍請求）、--max-requests 箝制步驟時間、
      # --empty-streak 偵測 Yahoo 靜默限速（限速時回空 feed 而非錯誤）、
      # --fail-tolerance 容忍零星逾時、continue-on-error 確保新聞絕不擋住行情發布。
      #
      # runner 實測（2026-07-31，ubuntu-latest 美國 IP）：20 檔真實股票全部
      # http=200／items=20，Yahoo TW RSS 沒有地域限制；連打 60 檔（sleep 0.4）
      # 空回散落在 [3,5,6,8,9,10,14,...]（皆為不存在的代號）而非群聚在後段，
      # 最長連續空回 4 檔 → 無限速跡象，--empty-streak 40 不會誤觸發。
      # 68.4s／60 檔 → 412 檔約 7.8 分鐘。
      - name: 抓取個股新聞（各排行前 50 聯集 + 自選股，Yahoo RSS）
        continue-on-error: true
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m stock_chip.news --days "$DAYS" \
            --from-rankings 50 --include-db-watchlist \
            --limit 8 --sleep 0.4 --max-requests 500 \
            --empty-streak 40 --fail-tolerance 0.2

      - name: 同步最新美股新聞快取（自 site 分支）
        continue-on-error: true
        run: |
          if git ls-remote --exit-code origin site >/dev/null 2>&1; then
            git fetch origin site
            git show origin/site:docs/data/ci_us_news.json > docs/data/ci_us_news.json
          fi

      - name: 匯出靜態網站資料
        run: python -m stock_chip.export_static --out docs

      - name: 發布網站到 site 分支並提交報表
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r reports /tmp/reports-backup
          # 1) docs 整包發布到 site 分支（單一 commit 歷史，避免 repo 膨脹）
          git checkout --orphan site-publish
          git reset -q
          git add docs
          git commit -q -m "Publish site data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push -f origin HEAD:site; then
              break
            fi
            sleep 5
          done
          # 2) 過渡期偵測：Pages 仍從 main 供應時，docs 也同步提交到 main；
          #    使用者把 Pages 來源切到 site 分支後，這段自動停止
          pages_branch=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" | python3 -c "import json,sys; print((json.load(sys.stdin).get('source') or {}).get('branch',''))" 2>/dev/null || echo "")
          cp -r docs /tmp/docs-backup
          git checkout -f main
          rm -rf reports
          cp -r /tmp/reports-backup reports
          git add reports
          if [ "$pages_branch" = "main" ]; then
            echo "Pages 仍從 main 供應，docs 同步提交到 main（過渡期）"
            rm -rf docs
            cp -r /tmp/docs-backup docs
            git add docs
          fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update Taiwan stock data and rankings"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            # 報表 commit 衝突以本次為準（rebase 中 theirs = 本次 commit）
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              exit 1
            fi
          done
          git push

      - name: 確認 Pages 部署成功（失敗自動重新請求建置）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          check_build() {
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds/latest" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status') or '')"
          }
          # 等最新建置離開排隊/建置中狀態（最多 ~4 分鐘）
          for i in $(seq 1 24); do
            status=$(check_build)
            echo "pages build status: $status"
            if [ "$status" = "built" ]; then
              echo "Pages 部署成功"; exit 0
            fi
            if [ "$status" = "errored" ]; then
              echo "Pages 部署失敗，重新請求建置"
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
              sleep 30
            else
              sleep 10
            fi
          done
          echo "警告：Pages 部署狀態未在時限內轉為 built（不中斷流程，網站可能暫時停留在前一版）"

      - name: 資料來源健康檢查（異常自動開 GitHub Issue）
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m stock_chip.health --github-issue
