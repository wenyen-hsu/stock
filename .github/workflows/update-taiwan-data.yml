name: Update Taiwan Stock Data

on:
  workflow_dispatch:
    inputs:
      days:
        description: "更新與掃描的交易日數"
        required: false
        default: "20"
  schedule:
    # GitHub Actions 用 UTC。14:30 UTC = 台北 22:30，
    # 此時當日行情、三大法人與融資融券資料皆已公布。
    - cron: "30 14 * * 1-5"

permissions:
  contents: write
  pages: read
  issues: write

concurrency:
  group: update-taiwan-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 還原 SQLite 快取（增量更新，避免每次全量重抓觸發限速）
        uses: actions/cache@v4
        with:
          path: data/stock_chip.sqlite
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 更新官方行情、三大法人與融資融券
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
        run: python -m stock_chip.official --days "$DAYS"

      - name: 更新公司基本資料與產業分類
        continue-on-error: true
        run: python -m stock_chip.profile

      - name: 初步掃描（產生營收抓取名單）
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
        run: python -m stock_chip.scan --days "$DAYS" --limit 50

      - name: 更新月營收（排行優先補缺漏月份 + 全市場分批補齊）
        continue-on-error: true
        run: |
          python -m stock_chip.revenue --months 24 --from-scan 200 --only-missing-month --sleep 0.4
          python -m stock_chip.revenue --months 24 --fill-market 250 --only-missing-month --sleep 0.5

      - name: 更新季度財報三率與 EPS（MOPS，僅缺漏季度）
        continue-on-error: true
        run: python -m stock_chip.financials --quarters 8 --sleep 3

      - name: 更新大盤指數與期貨多空
        continue-on-error: true
        run: python -m stock_chip.market --days 400

      - name: 抓取 MOPS 重大事件
        continue-on-error: true
        run: python -m stock_chip.mops --days 14

      - name: 抓取除權息事件（TWSE TWT49U + TPEx prepost）
        continue-on-error: true
        run: python -m stock_chip.dividends --backfill-days 120

      - name: 更新 TDCC 股權分散表（每週資料，已入庫則跳過）
        continue-on-error: true
        run: python -m stock_chip.tdcc

      - name: 抓取分點 Top 10（排行前 300 檔 + 自選股，MoneyDJ）
        continue-on-error: true
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
          PYTHONUNBUFFERED: "1"
        run: python -m stock_chip.branch --days "$DAYS" --top 10 --from-scan 300 --sleep 1.0 --skip-existing --retry-sleeps 3,8

      - name: 抓取分點單日進出（排行前 100 檔 + 自選股，補齊近 20 天供連買/成本推估）
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        # --only-missing：已入庫的日子自動跳過；首跑回補 20 天（~70 分鐘），
        # 之後每天只補最新一天，新進榜股票自動回補整個視窗
        run: python -m stock_chip.branch --daily --days 20 --top 15 --from-scan 100 --only-missing --sleep 1.0 --retry-sleeps 3,8

      - name: 掃描 20 日與 5 日排行
        env:
          DAYS: ${{ github.event.inputs.days || '20' }}
        run: |
          python -m stock_chip.scan --days "$DAYS" --limit 50
          python -m stock_chip.scan --days 5 --limit 50

      - name: 回測統計與快照備份
        continue-on-error: true
        run: python -m stock_chip.backtest

      - name: 同步最新美股新聞快取（自 site 分支）
        continue-on-error: true
        run: |
          if git ls-remote --exit-code origin site >/dev/null 2>&1; then
            git fetch origin site
            git show origin/site:docs/data/ci_us_news.json > docs/data/ci_us_news.json
          fi

      - name: 匯出靜態網站資料
        run: python -m stock_chip.export_static --out docs

      - name: 發布網站到 site 分支並提交報表
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r reports /tmp/reports-backup
          # 1) docs 整包發布到 site 分支（單一 commit 歷史，避免 repo 膨脹）
          git checkout --orphan site-publish
          git reset -q
          git add docs
          git commit -q -m "Publish site data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push -f origin HEAD:site; then
              break
            fi
            sleep 5
          done
          # 2) 過渡期偵測：Pages 仍從 main 供應時，docs 也同步提交到 main；
          #    使用者把 Pages 來源切到 site 分支後，這段自動停止
          pages_branch=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" | python3 -c "import json,sys; print((json.load(sys.stdin).get('source') or {}).get('branch',''))" 2>/dev/null || echo "")
          cp -r docs /tmp/docs-backup
          git checkout -f main
          rm -rf reports
          cp -r /tmp/reports-backup reports
          git add reports
          if [ "$pages_branch" = "main" ]; then
            echo "Pages 仍從 main 供應，docs 同步提交到 main（過渡期）"
            rm -rf docs
            cp -r /tmp/docs-backup docs
            git add docs
          fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update Taiwan stock data and rankings"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            # 報表 commit 衝突以本次為準（rebase 中 theirs = 本次 commit）
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              exit 1
            fi
          done
          git push

      - name: 確認 Pages 部署成功（失敗自動重新請求建置）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          check_build() {
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds/latest" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status') or '')"
          }
          # 等最新建置離開排隊/建置中狀態（最多 ~4 分鐘）
          for i in $(seq 1 24); do
            status=$(check_build)
            echo "pages build status: $status"
            if [ "$status" = "built" ]; then
              echo "Pages 部署成功"; exit 0
            fi
            if [ "$status" = "errored" ]; then
              echo "Pages 部署失敗，重新請求建置"
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
              sleep 30
            else
              sleep 10
            fi
          done
          echo "警告：Pages 部署狀態未在時限內轉為 built（不中斷流程，網站可能暫時停留在前一版）"

      - name: 資料來源健康檢查（異常自動開 GitHub Issue）
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m stock_chip.health --github-issue
