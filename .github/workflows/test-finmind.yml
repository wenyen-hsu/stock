name: Test FinMind Branch
on:
  workflow_dispatch:
    inputs:
      token:
        description: "FinMind token (一次性測試，不會寫入 repo)"
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ github.event.inputs.token }}"
      - name: Probe FinMind branch dataset
        env:
          TOK: ${{ github.event.inputs.token }}
        run: |
          echo "== 帳號可用資料集 (user_info) =="
          curl -s "https://api.finmindtrade.com/api/v4/user_info" -H "Authorization: Bearer $TOK" -o /tmp/u.json -w "http %{http_code}\n"
          python3 -c "import json; p=json.load(open('/tmp/u.json')); print('level:', p.get('level'), '| api_request_limit:', p.get('api_request_limit'), '| user_count:', p.get('user_count'))" || cat /tmp/u.json
          echo "== 分點資料 TaiwanStockTradingDailyReport (2330) =="
          for d in 2026-06-12 2026-06-11 2026-06-10; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockTradingDailyReport&data_id=2330&date=$d" -H "Authorization: Bearer $TOK")
            python3 -c "import json; p=json.load(open('/tmp/r.json')); d=p.get('data') or []; print('$d http $code status', p.get('status'), 'rows', len(d), 'msg', str(p.get('msg'))[:90]); print('  cols:', list(d[0].keys())) if d else None; print('  sample:', json.dumps(d[0], ensure_ascii=False)[:200]) if d else None"
          done
