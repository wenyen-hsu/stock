name: Switch Pages Source

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: 將 Pages 部署來源切換到 site 分支 /docs（診斷輸出）
        run: |
          echo "== PUT /pages =="
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"site","path":"/docs"}}'
          cat /tmp/resp.json
          echo "== GET /pages =="
          curl -s -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
