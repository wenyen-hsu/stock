name: Switch Pages Source

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: 將 Pages 部署來源切換到 site 分支 /docs
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"site","path":"/docs"}}'
          echo "目前的 Pages 設定："
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
          echo "觸發一次 Pages 建置："
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
