name: Diag Source
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢視 TDCC 股權分散表 OpenAPI 回應結構
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          req = urllib.request.Request(
              "https://openapi.tdcc.com.tw/v1/opendata/1-5",
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
          )
          resp = urllib.request.urlopen(req, timeout=120)
          raw = resp.read()
          print("bytes:", len(raw), "content-type:", resp.headers.get("Content-Type"))
          data = json.loads(raw)
          print("type:", type(data).__name__, "records:", len(data))
          print("first record keys:", list(data[0].keys()))
          for row in data[:6]:
              print(row)
          # 2330 的所有級距
          key_id = next(k for k in data[0] if "代號" in k or "code" in k.lower() or "Code" in k)
          rows_2330 = [r for r in data if r.get(key_id) == "2330"]
          print(f"--- 2330: {len(rows_2330)} rows ---")
          for r in rows_2330:
              print(r)
          dates = {r[next(k for k in data[0] if '日期' in k or 'date' in k.lower())] for r in data[:1000]}
          print("dates seen (sample):", dates)
          EOF
