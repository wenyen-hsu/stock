name: Diag Source
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢視 TDCC 股權分散表 OpenAPI 回應結構
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          req = urllib.request.Request(
              "https://openapi.tdcc.com.tw/v1/opendata/1-5",
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
          )
          resp = urllib.request.urlopen(req, timeout=120)
          raw = resp.read()
          print("bytes:", len(raw), "content-type:", resp.headers.get("Content-Type"))
          data = json.loads(raw)
          print("records:", len(data))
          codes = [r["證券代號"] for r in data]
          from collections import Counter
          print("code length distribution:", Counter(len(c) for c in codes))
          near = sorted({repr(c) for c in codes if "2330" in c})
          print("codes containing 2330:", near[:10])
          # 抽 5 個長度 4 的代號
          four = sorted({c for c in codes if len(c) == 4})
          print("len-4 codes sample:", four[:10], "... total", len(four))
          rows = [r for r in data if r["證券代號"].strip() == "2330"]
          print(f"--- 2330 (strip 後): {len(rows)} rows ---")
          for r in rows:
              print(r)
          levels = sorted({r["持股分級"] for r in data})
          print("levels:", levels)
          EOF
