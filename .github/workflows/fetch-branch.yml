name: Fetch Branch Data

# 手動補抓分點資料（MoneyDJ 券商鏡像，免登入、雲端 IP 可直連）。
# 平日的自動抓取已併入每日更新流程（update-taiwan-data.yml），
# 這裡保留手動觸發：改參數重抓、或中斷後續傳。

on:
  workflow_dispatch:
    inputs:
      top:
        description: "每檔股票抓前 N 大買賣超分點"
        required: false
        default: "10"
      scope:
        description: "抓排行前幾檔（外加自選股）"
        required: false
        default: "300"

permissions:
  contents: read
  actions: write

concurrency:
  group: update-taiwan-data
  cancel-in-progress: false

jobs:
  fetch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 還原 SQLite 快取（與每日更新共用）
        uses: actions/cache@v4
        with:
          path: data/stock_chip.sqlite
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 抓取分點 Top N（排行前 N 檔 + 自選股）
        env:
          TOP: ${{ github.event.inputs.top || '10' }}
          SCOPE: ${{ github.event.inputs.scope || '300' }}
          PYTHONUNBUFFERED: "1"
        run: |
          # --skip-existing：中斷後重跑可續傳
          python -m stock_chip.branch --days 20 --top "$TOP" --from-scan "$SCOPE" --sleep 1.0 --skip-existing --retry-sleeps 3,8

      - name: 觸發重新匯出（把分點資料發布到網站）
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-taiwan-data.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已觸發重新匯出，約 5-10 分鐘後網站更新分點資料"
