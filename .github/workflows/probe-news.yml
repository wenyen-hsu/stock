name: probe-news (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: 探測 Yahoo TW RSS 在 GitHub runner（美國 IP）是否可用
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import time, requests, xml.etree.ElementTree as ET
          from stock_chip.news import YAHOO_RSS_URL, REQUEST_HEADERS
          ids = ["2330","2317","2454","3231","2382","1467","6488","3035","4919","8069",
                 "2412","2603","2609","1101","1216","2881","2882","5871","3711","6669"]
          t0 = time.time()
          for sid in ids:
              try:
                  r = requests.get(YAHOO_RSS_URL, params={"s": sid}, headers=REQUEST_HEADERS, timeout=15)
                  n = len(ET.fromstring(r.content).findall("./channel/item")) if r.ok else -1
                  print(f"{sid} http={r.status_code} items={n} bytes={len(r.content)} ct={r.headers.get('content-type','')[:40]}")
              except Exception as exc:
                  print(f"{sid} EXC {type(exc).__name__}: {str(exc)[:160]}")
              time.sleep(0.4)
          print(f"elapsed {time.time()-t0:.1f}s for {len(ids)} stocks")
          PY
      - name: 連打 60 檔看有無限速（觀察空回是否群聚在後段）
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import time, requests, xml.etree.ElementTree as ET
          from stock_chip.news import YAHOO_RSS_URL, REQUEST_HEADERS
          ids = [f"{i}" for i in range(2301, 2361)]
          empty_positions, t0 = [], time.time()
          for idx, sid in enumerate(ids):
              try:
                  r = requests.get(YAHOO_RSS_URL, params={"s": sid}, headers=REQUEST_HEADERS, timeout=15)
                  n = len(ET.fromstring(r.content).findall("./channel/item")) if r.ok else -1
                  if n <= 0:
                      empty_positions.append(idx)
              except Exception:
                  empty_positions.append(idx)
              time.sleep(0.4)
          print(f"empty/failed at positions: {empty_positions}")
          print(f"elapsed {time.time()-t0:.1f}s for {len(ids)} stocks -> 412 檔約 {(time.time()-t0)/len(ids)*412/60:.1f} 分鐘")
          PY
