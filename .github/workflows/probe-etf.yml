name: Probe ETF APIs

# 拋棄式：從 ETFortune 頁面萃取實際 XHR 端點，取得後移除本檔。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract rwd paths from ETFortune pages
        run: |
          for page in \
            "https://www.twse.com.tw/zh/ETFortune/" \
            "https://www.twse.com.tw/zh/ETFortune/products" \
            "https://www.twse.com.tw/zh/products/securities/etf/overview.html" \
            ; do
            echo "===== $page ====="
            curl -s -m 30 "$page" -H "User-Agent: Mozilla/5.0" | grep -oE '(rwd|api)/[A-Za-z0-9/_-]+' | sort -u | head -30
            echo
          done
      - name: Probe ETFortune-style endpoints
        run: |
          for url in \
            "https://www.twse.com.tw/rwd/zh/ETFortune/overview?response=json" \
            "https://www.twse.com.tw/rwd/zh/ETFortune/products?response=json" \
            "https://www.twse.com.tw/rwd/zh/ETFortune/productDetail?stkNo=0050&response=json" \
            "https://www.twse.com.tw/rwd/zh/ETFortune/etfHoldings?stkNo=0050&response=json" \
            ; do
            echo "===== $url ====="
            curl -s -m 25 "$url" -H "accept: application/json" -H "User-Agent: Mozilla/5.0" | head -c 700; echo; echo
          done
