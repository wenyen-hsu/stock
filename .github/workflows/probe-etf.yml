name: Probe ETF APIs

# 拋棄式：實跑 etf 模組驗證抓取與名單，驗證後移除本檔。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run etf module against temp db
        run: |
          python -m stock_chip.etf --db /tmp/probe.sqlite
          python3 - <<'PYEOF'
          import sqlite3, sys
          sys.path.insert(0, ".")
          from pathlib import Path
          from stock_chip.etf import load_etf_flows
          from stock_chip.official import connect_db
          with connect_db(Path("/tmp/probe.sqlite")) as conn:
              flows = load_etf_flows(conn)
              print("state:", flows["state"], "| hot rows:", len(flows["rows"]))
              for row in flows["rows"][:20]:
                  print(f"{row['etf_id']:8s} {row['name']:14s} {row['category']:4s} AUM {row['aum'] or 0:>16,.0f} 單位數 {row['units'] or 0:>16,.0f}")
              assert len(flows["rows"]) >= 10, "熱門名單過少"
          PYEOF
