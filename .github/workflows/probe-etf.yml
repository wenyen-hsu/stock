name: Probe ETF Holdings

# 拋棄式：單頁診斷 requests 抓回的 MoneyDJ 頁面與解析結果。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose single page
        run: |
          python3 - <<'PYEOF'
          import re, sys
          sys.path.insert(0, ".")
          from stock_chip.etf import get_html, parse_holdings_html, HOLDINGS_URL
          html = get_html(HOLDINGS_URL, params={"etfid": "0050.TW"})
          print("len:", len(html))
          for key in ("股票名稱", "持股", "比例", "增減"):
              print(f"  '{key}' in html:", key in html)
          parsed = parse_holdings_html(html)
          print("parsed rows:", len(parsed))
          print("sample:", parsed[:3])
          if not parsed:
              idx = html.find("股票名稱")
              print("context around 股票名稱:")
              print(html[max(0, idx - 300):idx + 800] if idx >= 0 else "(關鍵字不存在)")
              print("table tag count:", len(re.findall(r"<table", html)))
          PYEOF
