name: Probe ETF APIs

# 拋棄式：探測 ETF PCF（成分股）端點，取得後移除本檔。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Scan TWSE swagger for composition keywords
        run: |
          curl -s -m 30 "https://openapi.twse.com.tw/v1/swagger.json" | python3 -c "
          import json, sys
          spec = json.load(sys.stdin)
          for path, item in spec.get('paths', {}).items():
              desc = json.dumps(item, ensure_ascii=False)
              if any(k in desc for k in ('成分', '申購買回', 'PCF', '受益')) or any(k in path.lower() for k in ('pcf',)):
                  print(path, '|', next(iter(item.values())).get('summary', ''))
          " || true
      - name: Probe PCF candidates
        run: |
          for url in \
            "https://www.twse.com.tw/rwd/zh/ETF/etfPCF?stkNo=0050&response=json" \
            "https://www.twse.com.tw/rwd/zh/ETF/list?response=json" \
            "https://mis.twse.com.tw/stock/data/etf_basket_0050.txt" \
            "https://www.yuantaetfs.com/api/Trade/pcf?fundid=0050" \
            "https://www.twse.com.tw/rwd/zh/ETFReport/ETFRank?response=json" \
            "https://openapi.twse.com.tw/v1/opendata/t187ap48_L" \
            ; do
            echo "===== $url ====="
            curl -s -m 25 "$url" -H "accept: application/json" -H "User-Agent: Mozilla/5.0" | head -c 900; echo; echo
          done
