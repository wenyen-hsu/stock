name: Probe ETF APIs

# 拋棄式：探測 ETF 清單/規模/單位數/PCF 端點與欄位，取得後移除本檔。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Scan swaggers for ETF paths
        run: |
          echo "===== TWSE swagger ETF 相關 ====="
          curl -s -m 30 "https://openapi.twse.com.tw/v1/swagger.json" | python3 -c "
          import json, sys
          spec = json.load(sys.stdin)
          for path, item in spec.get('paths', {}).items():
              desc = json.dumps(item, ensure_ascii=False)
              if 'etf' in path.lower() or 'ETF' in desc:
                  print(path, '|', next(iter(item.values())).get('summary', ''))
          " || true
          echo "===== TPEx swagger ETF 相關 ====="
          curl -s -m 30 "https://www.tpex.org.tw/openapi/v1/swagger.json" | python3 -c "
          import json, sys
          spec = json.load(sys.stdin)
          for path, item in spec.get('paths', {}).items():
              desc = json.dumps(item, ensure_ascii=False)
              if 'etf' in path.lower() or 'ETF' in desc:
                  print(path, '|', next(iter(item.values())).get('summary', ''))
          " || true
      - name: Probe candidate endpoints
        run: |
          for url in \
            "https://openapi.twse.com.tw/v1/opendata/t187ap47_L" \
            "https://www.twse.com.tw/rwd/zh/ETF/etfIssueUnit?response=json" \
            "https://mis.twse.com.tw/stock/data/all_etf.txt" \
            ; do
            echo "===== $url ====="
            curl -s -m 30 "$url" -H "accept: application/json" | head -c 1200; echo
          done
