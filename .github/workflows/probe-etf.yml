name: Probe ETF Holdings

# 拋棄式：用 parse_holdings_html 解析真頁，失敗時印出真實表格結構。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Parse real page
        run: |
          python3 - <<'PYEOF'
          import re, sys
          sys.path.insert(0, ".")
          from stock_chip.etf import get_html, parse_holdings_html, HOLDINGS_URL
          html = get_html(HOLDINGS_URL, params={"etfid": "0050.TW"})
          print("len:", len(html), "| 股票名稱 in:", "股票名稱" in html)
          parsed = parse_holdings_html(html)
          print("parsed rows:", len(parsed))
          print("sample:", parsed[:5])
          if len(parsed) < 5:
              from bs4 import BeautifulSoup
              soup = BeautifulSoup(html, "html.parser")
              for i, table in enumerate(soup.find_all("table")):
                  text = table.get_text()
                  if "股票名稱" in text:
                      raw = str(table)
                      print(f"--- 含股票名稱的 table[{i}] 原始 HTML 前 2000 字 ---")
                      print(raw[:2000])
                      break
          PYEOF
