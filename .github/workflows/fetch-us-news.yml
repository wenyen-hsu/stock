name: Fetch US News

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "每個 RSS 最多抓幾則"
        required: false
        default: "15"
      max_rows:
        description: "docs/data/us_news.json 最多保留幾則"
        required: false
        default: "1000"
      market_only:
        description: "只抓市場新聞，不抓個股 RSS"
        required: false
        type: boolean
        default: true
      symbols:
        description: "個股 RSS 代號，market_only=false 時使用"
        required: false
        default: "AAPL,MSFT,NVDA,TSLA"
  schedule:
    # GitHub Actions uses UTC. Run hourly at :17 to avoid the top-of-hour rush.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-us-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and merge US news
        env:
          LIMIT: ${{ github.event.inputs.limit || '15' }}
          MAX_ROWS: ${{ github.event.inputs.max_rows || '1000' }}
          MARKET_ONLY: ${{ github.event.inputs.market_only || 'true' }}
          SYMBOLS: ${{ github.event.inputs.symbols || 'AAPL,MSFT,NVDA,TSLA' }}
        run: |
          args=(--out docs/data/us_news.json --limit "$LIMIT" --max-rows "$MAX_ROWS" --symbols "$SYMBOLS")
          if [ "$MARKET_ONLY" = "true" ]; then
            args+=(--market-only)
          fi
          python -m stock_chip.export_us_news_static "${args[@]}"

      - name: Commit updated news
        run: |
          if git diff --quiet -- docs/data/us_news.json; then
            echo "No US news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/us_news.json
          git commit -m "Update US news cache"
          git push
